<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style></head><body>
<title>Буксир</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Студия: слева макет на сером столе, справа узкая панель управления. Чёрное на бумаге, акцент алый. */
:root{
  --desk:#DEDCD7; --panel:#F7F6F3; --line:#D6D3CC; --fg:#151514; --mute:#77746D;
  --accent:#EC0F13; --chip:#ECEAE5; --on:#151514; --on-fg:#F7F6F3; --focus:#EC0F13;
  --f-ui:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#1B1B1A; --panel:#242423; --line:#383735; --fg:#EDEBE6; --mute:#9A978F;
  --accent:#FF5A45; --chip:#2F2E2C; --on:#EDEBE6; --on-fg:#1B1B1A; --focus:#FF5A45; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#1B1B1A; --panel:#242423; --line:#383735; --fg:#EDEBE6; --mute:#9A978F;
  --accent:#FF5A45; --chip:#2F2E2C; --on:#EDEBE6; --on-fg:#1B1B1A; --focus:#FF5A45; color-scheme:dark}
html,body{height:100%}
body{background:var(--desk);color:var(--fg);font:13px/1.35 var(--f-ui);margin:0;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:100%}
.stage{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;min-height:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:10px}
.maintabs{display:flex;gap:2px;margin-right:auto;margin-left:12px}
.maintabs button{border:0;background:none;cursor:pointer;font:500 15px/1 var(--f-ui);padding:8px 10px 9px;color:var(--mute);border-bottom:2px solid transparent}
.maintabs button:hover{color:var(--fg)}
.maintabs button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--accent)}
details.more{border-bottom:1px solid var(--line)}
details.more>summary{cursor:pointer;padding:14px 16px;font:500 11px/1 var(--f-num);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);list-style-position:inside}
details.more>summary:hover{color:var(--fg)}
details.more>.sec{border-bottom:0;border-top:1px solid var(--line)}
.brand svg{height:15px;width:auto;fill:var(--fg)}
.brand span{font:500 11px/1 var(--f-num);color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.modes{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.modes button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:500;white-space:nowrap}
.modes button[aria-pressed="true"]{background:var(--on);color:var(--on-fg)}
.canvas-wrap{position:relative;display:grid;place-items:center;min-height:0;min-width:0;overflow:hidden}
#cv{display:block;box-shadow:0 1px 2px rgba(0,0,0,.12),0 12px 40px rgba(0,0,0,.14);touch-action:none;cursor:grab;background:#fff}
#cv.drag{cursor:grabbing}
.drop{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--desk) 80%,transparent);
  border:2px dashed var(--accent);font-weight:500;font-size:15px;pointer-events:none}
.bottom{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px 14px;color:var(--mute)}
.bottom .fmts{display:flex;gap:4px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--on);color:var(--on-fg);border-color:var(--on)}
.play{display:flex;align-items:center;gap:8px;margin-left:auto}
.play .pill{min-width:92px}
.hint{font-size:12px}

.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-height:0;
  padding-right:max(0px,env(safe-area-inset-right,0px))}
.sec{border-bottom:1px solid var(--line);padding:14px 16px 16px;display:grid;gap:10px}
.sec h3{margin:0;font:500 11px/1 var(--f-num);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:8px}
.sec h3 .grow{margin-left:auto}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:6px 10px;cursor:pointer}
.chipbtn:hover{border-color:var(--fg)}
.chipbtn[aria-pressed="true"]{background:var(--on);color:var(--on-fg);border-color:var(--on)}
.tgroup{display:grid;gap:6px}
.tname{font-size:12px;color:var(--mute)}
.fields{display:grid;gap:8px;padding-top:4px}
.field{display:grid;gap:4px}
.field span{font-size:12px;color:var(--mute)}
.field input,.field textarea{font:inherit;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 9px;resize:vertical;line-height:1.35}
.field textarea.list{font:12px/1.45 var(--f-num);white-space:pre;overflow-x:auto}
.field input:focus,.field textarea:focus{border-color:var(--fg);outline:none}
.theme[aria-pressed="true"]{border-color:var(--fg)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr) 52px;align-items:center;gap:8px}
.row label{color:var(--fg)}
.row output{font:12px var(--f-num);text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--fg);margin:0}
.seg{display:flex;flex-wrap:wrap;gap:4px;grid-column:2 / 4}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 8px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--on);color:var(--on-fg);border-color:var(--on)}
.colors{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;align-items:center;gap:6px}
.sw input[type=color]{width:30px;height:24px;border:1px solid var(--line);border-radius:5px;padding:0;background:none;cursor:pointer}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.theme{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:var(--panel);cursor:pointer;min-width:0}
.theme i{width:22px;height:16px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.15)}
.theme span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{accent-color:var(--fg);width:15px;height:15px;margin:0}
.tabs{display:flex;gap:4px}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 12px;cursor:pointer;font:500 12px var(--f-num)}
.tabs button[aria-pressed="true"]{background:var(--on);color:var(--on-fg);border-color:var(--on)}
.grid9{display:grid;grid-template-columns:repeat(3,26px);gap:4px;grid-column:2 / 4}
.grid9 button{width:26px;height:26px;border:1px solid var(--line);background:var(--panel);border-radius:5px;cursor:pointer;display:grid;place-items:center}
.grid9 button::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--line)}
.grid9 button[aria-pressed="true"]{border-color:var(--fg)}
.grid9 button[aria-pressed="true"]::after{background:var(--accent)}
.imgbox{display:flex;gap:10px;align-items:center}
.imgbox img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--chip)}
.imgbox .meta{min-width:0;display:grid;gap:6px}
.imgbox .name{color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--fg);background:var(--fg);color:var(--panel);border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:500}
.btn.ghost{background:var(--panel);color:var(--fg);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.status{font-size:12px;color:var(--mute);min-height:16px}
.status.err{color:var(--accent)}
.bar{height:3px;background:var(--chip);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.note{font-size:12px;color:var(--mute);margin:0}

@media (max-width:860px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;height:auto}
  .stage{padding-right:max(16px,env(safe-area-inset-right,0px))}
  .canvas-wrap{height:62vh}
  .panel{border-left:0;border-top:1px solid var(--line);padding-left:max(0px,env(safe-area-inset-left,0px))}
}
@media (prefers-reduced-motion: reduce){ .modes button,.pill{transition:none} }
</style>

<div class="app">
  <main class="stage">
    <div class="top">
      <div class="brand" id="brand"><span>генератор</span></div>
      <div class="maintabs" id="tabsMain" role="group" aria-label="Раздел">
        <button id="t-graphic" data-tab="graphic" aria-pressed="true">Графика</button>
        <button id="t-rubric" data-tab="rubric" aria-pressed="false">Рубрики</button>
      </div>
      <div class="modes" role="group" aria-label="Режим" id="modes">
        <button id="m-struct" data-mode="struct">Интерференция</button>
        <button id="m-rings" data-mode="rings">Фото в контурах</button>
        <button id="m-trail" data-mode="trail">Шлейф</button>
      </div>
    </div>
    <div class="canvas-wrap" id="wrap">
      <canvas id="cv" width="1080" height="1350" aria-label="Макет"></canvas>
      <div class="drop" id="drop" hidden>Отпустите, чтобы поставить фото</div>
    </div>
    <div class="bottom">
      <div class="fmts" id="fmts" role="group" aria-label="Формат"></div>
      <div class="play">
        <span class="hint" id="hint"></span>
        <button class="pill" id="playBtn" aria-pressed="false">▶ Движение</button>
      </div>
    </div>
  </main>
  <aside class="panel" id="panel" aria-label="Настройки"></aside>
</div>
<input type="file" id="fileIn" accept="image/*" hidden>
<input type="file" id="partnerIn" accept="image/png,image/svg+xml,image/jpeg,image/webp" hidden>

<script>/* Буксир — текст.
   Шрифты разбираются opentype.js, текст выводится кривыми: холст и SVG рисуют одни и те же пути.
   Здесь же примитивы вёрстки: столбец строк с подбором кегля и плашками, строка «дата — время»,
   строка из нескольких частей, список афиши, логотип, логотип партнёра. */
'use strict';

const FACES = { d: 'Unbounded-SemiBold', dr: 'Unbounded-Regular', t: 'Onest-Regular', tm: 'Onest-Medium' };
const FONT = {}, CAP = {};
(function initFonts() {
  for (const k in FACES) {
    const bin = atob(window.__FONTS__[FACES[k]]);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    FONT[k] = opentype.parse(buf.buffer);
    CAP[k] = (FONT[k].tables.os2.sCapHeight || 700) / FONT[k].unitsPerEm;
    // те же шрифты для интерфейса страницы
    if (k === 't' || k === 'tm') {
      try { document.fonts.add(new FontFace('Onest', buf.buffer.slice(0), { weight: k === 't' ? '400' : '500' })); } catch (e) { /* системный шрифт */ }
    }
  }
})();

const ADV = new Map();
function adv(face, s, size) {
  const key = face + '\u0001' + s;
  let w = ADV.get(key);
  if (w === undefined) { w = FONT[face].getAdvanceWidth(s, 1000, { kerning: true }); if (ADV.size > 20000) ADV.clear(); ADV.set(key, w); }
  return w * size / 1000;
}
const PATHS = new Map();
function glyphPath(face, s, x, y, size) {
  const key = `${face}|${s}|${x.toFixed(1)}|${y.toFixed(1)}|${size.toFixed(2)}`;
  let d = PATHS.get(key);
  if (d === undefined) { d = FONT[face].getPath(s, x, y, size, { kerning: true }).toPathData(2); if (PATHS.size > 6000) PATHS.clear(); PATHS.set(key, d); }
  return d;
}

// Короткие предлоги и союзы не остаются в конце строки: склеиваем со следующим словом неразрывным пробелом.
const NB = ' ';
function typo(s) {
  return String(s)
    .replace(/(^|[\s(«])(в|во|с|со|к|ко|у|о|об|и|а|но|на|за|до|из|от|по|не|ни|для|без|при|про|над|под)\s+/gi, (m, a, w) => a + w + NB)
    .replace(/\s+(—|–)\s+/g, NB + '$1 ')
    .replace(/(\d)\s+(?=\d{3}\b)/g, '$1' + NB);
}
function wrapText(face, text, size, maxW) {
  const out = [];
  for (const para of String(text).split('\n')) {
    const words = para.split(/[ \t]+/).filter(Boolean);
    if (!words.length) { out.push(''); continue; }
    let line = words[0];
    for (let i = 1; i < words.length; i++) {
      const t = line + ' ' + words[i];
      if (adv(face, t, size) <= maxW) line = t; else { out.push(line); line = words[i]; }
    }
    out.push(line);
  }
  return out;
}

// Один абзац: подбираем кегль, чтобы влез по ширине и числу строк.
function layItem(it, maxW, scale) {
  const face = it.face || 'd';
  let src = it.text == null ? '' : String(it.text);

  let size = it.size * (it.grow === false ? 1 : scale);

  for (let guard = 0; guard < 60; guard++) {
    lines = wrapText(face, src, size, maxW);
    const wide = lines.some(l => adv(face, l, size) > maxW + 0.5);
    if ((!wide && lines.length <= (it.maxLines || 99)) || size <= min) break;
    size = Math.max(min, size * 0.95);
  }
  if (it.maxLines && lines.length > it.maxLines) {           // не влезло даже в минимальном кегле: обрезаем с многоточием
    lines = lines.slice(0, it.maxLines);
    let l = lines[lines.length - 1];
    while (l.length > 1 && adv(face, l + '…', size) > maxW) l = l.slice(0, -1);
    lines[lines.length - 1] = l.replace(/[\s,.;:]+$/, '') + '…';
  }
  const lh = size * (it.lh || 1.12);
  return { face, size, lines, lh, h: lines.length * lh };
}

/* ----- группы примитивов -----
   Группа: {tf:[a,b,c,d,e,f], prims:[...]}. Примитивы:
   {p:'path', d, fill, alpha}  {p:'rect', x,y,w,h, fill, alpha}  {p:'logo', m, fill}  {p:'img', x,y,w,h} (партнёр) */
const ID = [1, 0, 0, 1, 0, 0];

function textLine(prims, face, s, x, top, size, lh, fill, plate, upper) {
  const cap = CAP[face] * size;
  const base = top + (lh - cap) / 2 + cap;
  const w = adv(face, s, size);
  if (plate) {
    const px = size * 0.26, pt = size * 0.24;
    const desc = !upper && /[a-zа-яё,;()qypgдруфщц]/.test(s) ? size * 0.2 : 0;
    prims.push({ p: 'rect', x: x - px, y: base - cap - pt, w: w + 2 * px, h: cap + 2 * pt + desc, fill: plate });
  }
  if (s) prims.push({ p: 'path', d: glyphPath(face, s, x, base, size), fill });
  return w;
}

// Столбец абзацев. spec: {x,y,w,h, ax, ay:'t'|'m'|'b', rot:0|-90, items:[{text, face, size, min, lh, upper, color, plate, maxLines, gap, ax, grow}]}
function stackGroup(spec, col) {
  const rot = spec.rot === -90;
  const W = rot ? spec.h : spec.w, H = rot ? spec.w : spec.h;
  const items = spec.items.filter(it => it && it.text != null && String(it.text).trim() !== '');
  let lays, total, scale = 1;
  for (let guard = 0; guard < 40; guard++) {
    lays = items.map(it => layItem(it, W, scale));
    total = lays.reduce((a, l, i) => a + l.h + (i < lays.length - 1 ? (items[i].gap || 0) * (items[i].grow === false ? 1 : scale) : 0), 0);
    if (total <= H || scale < 0.4) break;
    scale *= 0.95;
  }
  let y = spec.ay === 'b' ? H - total : spec.ay === 'm' ? (H - total) / 2 : 0;
  const prims = [];
  const rects = [];
  lays.forEach((L, i) => {
    const it = items[i];
    const ax = it.ax || spec.ax || 'l';
    for (const line of L.lines) {
      const w = adv(L.face, line, L.size);
      const x = ax === 'r' ? W - w : ax === 'c' ? (W - w) / 2 : 0;
      const before = prims.length;
      textLine(prims, L.face, line, x, y, L.size, L.lh, col(it.color || 'text'), it.plate ? col(it.plate) : null, it.upper);
      // плашки собираем отдельно, чтобы они лежали под всеми строками
      for (let k = before; k < prims.length; k++) if (prims[k].p === 'rect') rects.push(prims.splice(k--, 1)[0]);
      y += L.lh;
    }
    y += (it.gap || 0) * (it.grow === false ? 1 : scale);
  });
  const tf = rot ? [0, -1, 1, 0, spec.x, spec.y + spec.h] : [1, 0, 0, 1, spec.x, spec.y];
  return { tf, prims: rects.concat(prims), box: { y0: spec.ay === 'b' ? H - total : 0, h: total } };
}

// «дата ——— время» и, если задано, примечание справа. y — середина прописных.
function datelineGroup(spec, col, u) {
  const face = spec.face || 'dr', size = spec.size, fill = col(spec.color || 'text');
  const cap = CAP[face] * size;
  const top = spec.y - cap / 2 - (size * 1.12 - cap) / 2, lh = size * 1.12;
  const prims = [];
  const L = typo(spec.left || ''), R = typo(spec.right || ''), N = typo(spec.note || '');
  const wl = adv(face, L, size), wr = adv(face, R, size);
  const gap = size * 0.55, lw = Math.max(1.5, 2.2 * u);
  let x = spec.x;
  if (spec.ax === 'c') {
    const len = spec.lineLen || 130 * u;
    x = spec.x + (spec.w - (wl + wr + 2 * gap + len)) / 2;
  }
  if (spec.plate) {
    const pad = size * 0.4;
    prims.push({ p: 'rect', x: spec.x - pad, y: spec.y - cap / 2 - pad, w: spec.w + 2 * pad, h: cap + 2 * pad, fill: col(spec.plate) });
  }
  if (L) textLine(prims, face, L, x, top, size, lh, fill, null, true);
  let lineEnd;
  if (N || spec.ax === 'c' || spec.lineLen) lineEnd = x + wl + gap + (spec.lineLen || 130 * u);
  else lineEnd = spec.x + spec.w - wr - gap;
  if (R) {
    if (L) prims.push({ p: 'rect', x: x + wl + gap, y: spec.y - lw / 2, w: Math.max(0, lineEnd - (x + wl + gap)), h: lw, fill });
    textLine(prims, face, R, lineEnd + gap, top, size, lh, fill, null, true);
  }
  if (N) {
    const nf = spec.noteFace || face;
    const ns = typo(N.toUpperCase()), w = adv(nf, ns, size * 0.82);
    const s2 = size * 0.82, cap2 = CAP[nf] * s2;
    textLine(prims, nf, ns, spec.x + spec.w - w, spec.y - cap2 / 2 - (s2 * 1.12 - cap2) / 2, s2, s2 * 1.12, fill, null, true);
  }
  return { tf: ID, prims };
}

// Строка из частей: первая слева, последняя справа, остальные распределены между ними.
function rowGroup(spec, col) {
  const face = spec.face || 't', size = spec.size, fill = col(spec.color || 'text');
  const cap = CAP[face] * size, lh = size * 1.12, top = spec.y - cap / 2 - (lh - cap) / 2;
  const parts = spec.parts.map(p => typo(spec.upper ? String(p).toUpperCase() : String(p))).filter(Boolean);
  const prims = [];
  const ws = parts.map(p => adv(face, p, size));
  if (parts.length === 1) { textLine(prims, face, parts[0], spec.x, top, size, lh, fill, null, spec.upper); return { tf: ID, prims }; }
  const free = spec.w - ws.reduce((a, b) => a + b, 0);
  let x = spec.x;
  parts.forEach((p, i) => { textLine(prims, face, p, x, top, size, lh, fill, null, spec.upper); x += ws[i] + free / (parts.length - 1); });
  return { tf: ID, prims };
}

// Список афиши: «число | название | время» по строкам.
function listGroup(spec, col, u) {
  const rows = String(spec.rows || '').split('\n').map(r => r.split('|').map(s => s.trim())).filter(r => r.length && r[0] !== '');
  const prims = [];
  if (!rows.length) return { tf: ID, prims };
  const fillT = col(spec.color || 'text'), fillD = col(spec.dayColor || spec.color || 'text');
  const lay = (s) => {
    const dS = 76 * u * s, tS = 23 * u * s, hS = 26 * u * s;
    const dayW = adv('d', '00', dS) + 26 * u * s;
    const timeW = Math.max(...rows.map(r => adv('dr', r[2] || '', hS))) + 22 * u * s;
    const titleW = spec.w - dayW - timeW;
    const items = rows.map(r => {
      const it = layItem({ text: r[1] || '', face: 'tm', size: tS, lh: 1.08, upper: true, maxLines: 3, min: tS * 0.8 }, titleW, 1);
      const h = Math.max(CAP.d * dS, it.h) + 26 * u * s;
      return { r, it, h };
    });
    return { dS, tS, hS, dayW, timeW, titleW, items, total: items.reduce((a, b) => a + b.h, 0) };
  };
  let s = 1, L = lay(s);
  for (let g = 0; g < 30 && L.total > spec.h; g++) { s *= 0.94; L = lay(s); }
  let y = spec.y;
  const lw = Math.max(1, 1.6 * u);
  L.items.forEach(({ r, it, h }, i) => {
    const mid = y + h / 2 - 13 * u * s;
    const day = r[0];
    const dw = adv('d', day, L.dS);
    textLine(prims, 'd', day, spec.x + L.dayW - 26 * u * s - dw, mid - (L.dS * 1.12) / 2, L.dS, L.dS * 1.12, fillD, null, true);
    let ty = mid - it.h / 2;
    for (const line of it.lines) { textLine(prims, 'tm', line, spec.x + L.dayW, ty, it.size, it.lh, fillT, null, true); ty += it.lh; }
    const tw = adv('dr', r[2] || '', L.hS);
    if (r[2]) textLine(prims, 'dr', r[2], spec.x + spec.w - tw, mid - (L.hS * 1.12) / 2, L.hS, L.hS * 1.12, fillT, null, true);
    y += h;
    if (i < L.items.length - 1) prims.push({ p: 'rect', x: spec.x + L.dayW, y: y - lw / 2, w: spec.w - L.dayW, h: lw, fill: fillT, alpha: 0.18 });
  });
  return { tf: ID, prims };
}

function logoGroup(spec, col) {
  const k = spec.w / LOGO.w, h = LOGO.h * k;
  const x = spec.ax === 'r' ? spec.x - spec.w : spec.ax === 'c' ? spec.x - spec.w / 2 : spec.x;
  const prims = [];
  if (spec.plate) { const p = h * 0.55; prims.push({ p: 'rect', x: x - p, y: spec.y - p, w: spec.w + 2 * p, h: h + 2 * p, fill: col(spec.plate) }); }
  prims.push({ p: 'logo', m: [k, 0, 0, k, x, spec.y], fill: col(spec.color || 'text') });
  return { tf: ID, prims, h };
}
function partnerGroup(spec) {
  if (!PARTNER) return null;
  const iw = PARTNER.naturalWidth || PARTNER.width, ih = PARTNER.naturalHeight || PARTNER.height;
  const h = spec.h, w = iw / ih * h;
  const x = spec.ax === 'r' ? spec.x - w : spec.x;
  return { tf: ID, prims: [{ p: 'img', x, y: spec.y, w, h }] };
}
function rectGroup(spec, col) { return { tf: ID, prims: [{ p: 'rect', x: spec.x, y: spec.y, w: spec.w, h: spec.h, fill: col(spec.color), alpha: spec.alpha }] }; }

}
// Цвет по роли: текст, фон, графика, акцент (красный; на красном фоне — цвет текста).

  if (key === 'text') return S.text;
  if (key === 'bg') return S.bg;
  if (key === 'ink') return S.ink;
  if (key === 'accent') return same(S.bg, RED) ? S.text : RED;

}

const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fr = (v) => ((v % 1) + 1) % 1;
const n2 = (v) => (Math.round(v * 100) / 100).toString();
const ANCH = { tl: [0, 0], tc: [.5, 0], tr: [1, 0], cl: [0, .5], c: [.5, .5], cr: [1, .5], bl: [0, 1], bc: [.5, 1], br: [1, 1] };
const getPath = (o, p) => p.split('.').reduce((a, k) => a[k], o);
const setPath = (o, p, v) => { const ks = p.split('.'); const last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; };
function merge(dst, src) { for (const k in src) { if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k])) merge(dst[k], src[k]); else dst[k] = src[k]; } }
function fmtSize() { const f = FORMATS.find(f => f[0] === S.fmt) || FORMATS[1]; return [f[2], f[3]]; }

/* ---------- геометрия ---------- */
// Скруглённый прямоугольник как SVG-путь (центр, полуоси, радиус). Используется и для холста (Path2D), и для SVG.
function rr(cx, cy, hw, hh, r) {
  r = clamp(r, 0, Math.min(hw, hh));
  const x0 = cx - hw, x1 = cx + hw, y0 = cy - hh, y1 = cy + hh;
  if (r < .01) return `M${n2(x0)} ${n2(y0)}H${n2(x1)}V${n2(y1)}H${n2(x0)}Z`;
  const a = `A${n2(r)} ${n2(r)} 0 0 1 `;
  return `M${n2(x0 + r)} ${n2(y0)}H${n2(x1 - r)}${a}${n2(x1)} ${n2(y0 + r)}V${n2(y1 - r)}${a}${n2(x1 - r)} ${n2(y1)}H${n2(x0 + r)}${a}${n2(x0)} ${n2(y1 - r)}V${n2(y0 + r)}${a}${n2(x0 + r)} ${n2(y0)}Z`;
}

// Список контуров набора в фазе tau (0..1). x — непрерывный номер контура.
// Крайние контуры плавно набирают и теряют толщину, поэтому цикл без шва.
function rings(P, tau, W, H, u, still) {
  const N = Math.max(1, Math.round(P.n));
  const f = still ? 0 : fr((P.speed || 0) * tau);
  const out = [];
  for (let k = -1; k < N; k++) {
    const x = k + f;
    const m = clamp(x + 1, 0, 1) * clamp(N - x, 0, 1);

    seg('exp.vfmt', 'Видео', [['mp4', 'MP4'], ['webm', 'WebM'], ['gif', 'GIF']], () => buildPanel()),
    sc.vfmt === 'gif'
      ? seg('exp.gifScale', 'Размер GIF', [[1, '×1'], [.5, '×½'], [.33, '×⅓']])
      : seg('exp.fps', 'Кадров/с', [[25, '25'], [30, '30'], [60, '60']]),
    seg('exp.loops', 'Циклов', [[1, '1'], [2, '2'], [4, '4']]),
    h('div', { class: 'btns' }, h('button', { class: 'btn', type: 'button', 'data-exp': '', onclick: exportVideo }, 'Записать ' + (sc.vfmt === 'gif' ? 'GIF' : 'видео'))),
    h('div', { class: 'bar' }, h('i', { id: 'bar' })),
    h('div', { class: 'status', id: 'status', role: 'status' }));
  return s;
}
function renderTo(W, H, t, still) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  drawScene(c.getContext('2d'), buildScene(W, H, t, still)); return c;
}
async function exportPNG() {
  if (busy) return; setBusy(true);
  try {
    const [W, H] = fmtSize(); const k = S.exp.scale;
    const c = renderTo(W * k, H * k, tau, false);
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    status('Готовлю PNG…');
    const ok = await saveFile(fname('png'), blob);
    status(ok ? `PNG ${W * k} × ${H * k} готов.` : '');
  } catch (e) { status('Не получилось сохранить PNG: ' + e.message, true); }
  setBusy(false);
}
async function exportSVG() {
  if (busy) return; setBusy(true);
  try {
    const [W, H] = fmtSize();
    const svg = sceneSVG(buildScene(W, H, tau, false));
    const ok = await saveFile(fname('svg'), new Blob([svg], { type: 'image/svg+xml' }));
    status(ok ? 'SVG готов. Контуры в кривых, логотип отдельным слоем.' : '');
  } catch (e) { status('Не получилось собрать SVG: ' + e.message, true); }
  setBusy(false);
}
const nextTick = () => new Promise(r => setTimeout(r, 0));
async function exportVideo() {
  if (busy) return;
  const wasPlaying = playing; setPlaying(false); setBusy(true); progress(0);
  try {
    if (S.exp.vfmt === 'gif') await recordGIF(); else await recordVideo(S.exp.vfmt);
  } catch (e) { status('Запись не удалась: ' + (e && e.message || e), true); }
  progress(0); setBusy(false); if (wasPlaying) setPlaying(true); else render();
}
async function recordVideo(kind) {
  if (!('VideoEncoder' in window)) throw new Error('браузер не умеет кодировать видео. Откройте страницу в Chrome или Edge.');
  let [W, H] = fmtSize(); W -= W % 2; H -= H % 2;
  const fps = S.exp.fps, frames = Math.round(S.anim.dur * fps * S.exp.loops);
  const bitrate = Math.round(W * H * fps * 0.22);
  let codec, muxer, target;
  if (kind === 'mp4') {
    const tries = ['avc1.640034', 'avc1.640033', 'avc1.640028', 'avc1.4d0034', 'avc1.42003e'];
    for (const c of tries) { const r = await VideoEncoder.isConfigSupported({ codec: c, width: W, height: H, bitrate, framerate: fps }).catch(() => null); if (r && r.supported) { codec = c; break; } }
    if (!codec) throw new Error('кодировщик H.264 недоступен в этом браузере. Выберите WebM.');
    target = new Mp4Muxer.ArrayBufferTarget();
    muxer = new Mp4Muxer.Muxer({ target, video: { codec: 'avc', width: W, height: H, frameRate: fps }, fastStart: 'in-memory' });
  } else {
    codec = 'vp09.00.41.08';
    const r = await VideoEncoder.isConfigSupported({ codec, width: W, height: H, bitrate, framerate: fps }).catch(() => null);
    if (!r || !r.supported) throw new Error('кодировщик VP9 недоступен в этом браузере. Выберите MP4.');
    target = new WebMMuxer.ArrayBufferTarget();
    muxer = new WebMMuxer.Muxer({ target, video: { codec: 'V_VP9', width: W, height: H, frameRate: fps } });
  }
  let encErr = null;
  const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: (e) => { encErr = e; } });
  enc.configure({ codec, width: W, height: H, bitrate, framerate: fps, latencyMode: 'quality' });
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  for (let i = 0; i < frames; i++) {
    if (encErr) throw encErr;
    drawScene(g, buildScene(W, H, (i / (S.anim.dur * fps)) % 1, false));
    const vf = new VideoFrame(c, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
    enc.encode(vf, { keyFrame: i % (fps * 2) === 0 }); vf.close();
    if (enc.encodeQueueSize > 8) await new Promise(r => enc.addEventListener('dequeue', r, { once: true }));
    if (i % 4 === 0) { progress(i / frames); status(`Кодирую кадр ${i + 1} из ${frames}…`); await nextTick(); }
  }
  await enc.flush(); enc.close(); muxer.finalize();
  status('Сохраняю…');
  const ok = await saveFile(fname(kind), new Blob([target.buffer], { type: kind === 'mp4' ? 'video/mp4' : 'video/webm' }));
  status(ok ? `Видео ${W} × ${H}, ${fps} к/с, ${(frames / fps).toFixed(1)} с готово.` : '');
}
async function recordGIF() {
  const [W0, H0] = fmtSize(); const k = S.exp.gifScale;
  const W = Math.round(W0 * k), H = Math.round(H0 * k);
  const fps = 25, frames = Math.round(S.anim.dur * fps * S.exp.loops);
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d', { willReadFrequently: true });
  const { GIFEncoder, quantize, applyPalette } = window.gifenc;
  const gif = GIFEncoder();
  // общая палитра по нескольким кадрам цикла
  const samples = [];
  for (let i = 0; i < 6; i++) { drawScene(g, buildScene(W, H, i / 6, false)); samples.push(g.getImageData(0, 0, W, H).data); }
  const step = Math.max(1, Math.floor(samples.length * W * H / 400000));
  const pick = [];
  for (const d of samples) for (let p = 0; p < W * H; p += step) pick.push(d[p * 4], d[p * 4 + 1], d[p * 4 + 2], 255);
  const palette = quantize(new Uint8Array(pick), S.mode === 'struct' ? 32 : 256, { format: 'rgb565' });
  for (let i = 0; i < frames; i++) {
    drawScene(g, buildScene(W, H, (i / (S.anim.dur * fps)) % 1, false));
    const d = g.getImageData(0, 0, W, H).data;
    gif.writeFrame(applyPalette(d, palette, 'rgb565'), W, H, { palette: i === 0 ? palette : undefined, delay: 1000 / fps, repeat: 0 });
    if (i % 3 === 0) { progress(i / frames); status(`Кадр ${i + 1} из ${frames}…`); await nextTick(); }
  }
  gif.finish();
  const ok = await saveFile(fname('gif'), new Blob([gif.bytes()], { type: 'image/gif' }));
  status(ok ? `GIF ${W} × ${H}, ${(frames / fps).toFixed(1)} с готов.` : '');
}

/* ---------- верхняя и нижняя панели ---------- */
const VISITED = { graphic: new Set(), rubric: new Set() };
function setMode(m, keep) {
  S.mode = m;
  const V = VISITED[S.tab];
  if (keep) V.add(m);
  if (!V.has(m)) { V.add(m); const first = { struct: P_STRUCT, rings: P_RINGS, trail: P_TRAIL }[m][0][1]; const keep = S.logo; applyPreset(first); S.logo = keep; }
  document.querySelectorAll('#modes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
  $('hint').textContent = m === 'trail' ? 'Тяните фото на макете' : 'Тяните контуры на макете';
  if (!playing) tau = 0;
  buildPanel(); update();
}
document.querySelectorAll('#modes button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

/* ---------- вкладки: «Графика» (заготовки без текста) и «Рубрики» (шаблоны с текстом) ----------
   У каждой вкладки свои настройки: при переключении состояние запоминается и возвращается. */
const TAB_KEYS = ['mode', 'bg', 'ink', 'inkB', 'text', 'theme', 'twoTone', 'blend', 'grain', 'A', 'B', 'R', 'T', 'logo', 'setTab', 'tpl'];
const TABSTATE = {};
const clone = (o) => JSON.parse(JSON.stringify(o));
function setTab(t) {
  if (S.tab === t) return;
  if (S.tab) TABSTATE[S.tab] = clone(Object.fromEntries(TAB_KEYS.map(k => [k, S[k]])));
  S.tab = t;
  document.querySelectorAll('#tabsMain button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === t)));
  $('modes').hidden = t === 'rubric';
  try { history.replaceState(null, '', t === 'rubric' ? '#rubriki' : '#grafika'); } catch (e) { /* без адреса */ }
  if (TABSTATE[t]) { Object.assign(S, clone(TABSTATE[t])); setMode(S.mode, true); }
  else if (t === 'rubric') applyTemplate('lecture');
  else { S.tpl = null; S.logo.on = false; applyTheme('white'); applyPreset(P_STRUCT[0][1]); setMode('struct', true); }
}
document.querySelectorAll('#tabsMain button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
window.addEventListener('hashchange', () => setTab(location.hash === '#rubriki' ? 'rubric' : 'graphic'));
function buildFormats() {
  const box = $('fmts'); box.replaceChildren();
  for (const [k, name, w, hgt] of FORMATS) {
    const b = h('button', { type: 'button', class: 'pill', 'aria-pressed': String(S.fmt === k), title: `${w} × ${hgt}` }, name);
    b.addEventListener('click', () => { S.fmt = k; buildFormats(); update(); });
    box.append(b);
  }
}
$('playBtn').addEventListener('click', () => setPlaying(!playing));
document.addEventListener('keydown', (e) => { if (e.code === 'Space' && !/INPUT|BUTTON|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); setPlaying(!playing); } });
$('brand').prepend(new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${LOGO.w} ${LOGO.h}" role="img" aria-label="Буксир"><path fill-rule="evenodd" d="${LOGO.d}"/></svg>`, 'image/svg+xml').documentElement);

/* ---------- загрузка фото ---------- */
function loadFile(file) {
  if (!file || !/^image\//.test(file.type)) { status('Нужен файл изображения: JPG, PNG или WebP.', true); return; }
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => { setImage(im, file.name); if (S.mode === 'struct') setMode('rings'); else { buildPanel(); update(); } };
  im.onerror = () => status('Не удалось открыть это изображение.', true);
  im.src = url;
}
$('fileIn').addEventListener('change', (e) => { loadFile(e.target.files[0]); e.target.value = ''; });
const wrap = $('wrap');
['dragenter', 'dragover'].forEach(t => wrap.addEventListener(t, (e) => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); $('drop').hidden = false; } }));
['dragleave', 'drop'].forEach(t => wrap.addEventListener(t, (e) => { e.preventDefault(); $('drop').hidden = true; if (t === 'drop' && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); }));
document.addEventListener('paste', (e) => { const f = [...(e.clipboardData?.files || [])].find(f => /^image\//.test(f.type)); if (f) loadFile(f); });

$('partnerIn').addEventListener('change', (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !/^image\//.test(f.type)) return;
  const rd = new FileReader();
  rd.onload = () => { const im = new Image(); im.onload = () => { PARTNER = im; PARTNER_URL = rd.result; OVERLAY.key = ''; buildPanel(); update(); }; im.src = rd.result; };
  rd.readAsDataURL(f);
});

/* ---------- старт ---------- */
setImage(makeDemo(), 'Пример');
buildFormats();
setTab(location.hash === '#rubriki' ? 'rubric' : 'graphic');
window.__buksir = { S, setTab, render, buildScene, sceneSVG, setMode, applyPreset, applyTemplate, TEMPLATES, P_STRUCT, P_RINGS, P_TRAIL, setTau: (t) => { tau = t; render(); }, renderTo,
  setFmt: (f) => { S.fmt = f; buildFormats(); render(); } };
</script>
