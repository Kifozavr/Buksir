<title>Буксир</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Студия: слева макет на сером столе, справа узкая панель управления. Чёрное на бумаге, акцент алый. */
:root{
  --desk:#DEDCD7; --panel:#F7F6F3; --line:#D6D3CC; --fg:#151514; --mute:#77746D;
  --accent:#C9301E; --chip:#ECEAE5; --on:#151514; --on-fg:#F7F6F3; --focus:#C9301E;
  --f-ui:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#1B1B1A; --panel:#242423; --line:#383735; --fg:#EDEBE6; --mute:#9A978F;
  --accent:#FF5A45; --chip:#2F2E2C; --on:#EDEBE6; --on-fg:#1B1B1A; --focus:#FF5A45; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#1B1B1A; --panel:#242423; --line:#383735; --fg:#EDEBE6; --mute:#9A978F;
  --accent:#FF5A45; --chip:#2F2E2C; --on:#EDEBE6; --on-fg:#1B1B1A; --focus:#FF5A45; color-scheme:dark}
html,body{height:100%}
body{background:var(--desk);color:var(--fg);font:13px/1.35 var(--f-ui);margin:0;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:100%}
.stage{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;min-height:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{height:15px;width:auto;fill:var(--fg)}
.brand span{font:500 11px/1 var(--f-num);color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.modes{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.modes button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:500;white-space:nowrap}
.modes button[aria-pressed="true"]{background:var(--on);color:var(--on-fg)}
.canvas-wrap{position:relative;display:grid;place-items:center;min-height:0;min-width:0;overflow:hidden}
#cv{display:block;box-shadow:0 1px 2px rgba(0,0,0,.12),0 12px 40px rgba(0,0,0,.14);touch-action:none;cursor:grab;background:#fff}
#cv.drag{cursor:grabbing}
.drop{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--desk) 80%,transparent);
  border:2px dashed var(--accent);font-weight:500;font-size:15px;pointer-events:none}
.bottom{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px 14px;color:var(--mute)}
.bottom .fmts{display:flex;gap:4px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--on);color:var(--on-fg);border-color:var(--on)}
.play{display:flex;align-items:center;gap:8px;margin-left:auto}
.play .pill{min-width:92px}
.hint{font-size:12px}

.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-height:0;
  padding-right:max(0px,env(safe-area-inset-right,0px))}
.sec{border-bottom:1px solid var(--line);padding:14px 16px 16px;display:grid;gap:10px}
.sec h3{margin:0;font:500 11px/1 var(--f-num);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:8px}
.sec h3 .grow{margin-left:auto}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:6px 10px;cursor:pointer}
.chipbtn:hover{border-color:var(--fg)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr) 52px;align-items:center;gap:8px}
.row label{color:var(--fg)}
.row output{font:12px var(--f-num);text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--fg);margin:0}
.seg{display:flex;flex-wrap:wrap;gap:4px;grid-column:2 / 4}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 8px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--on);color:var(--on-fg);border-color:var(--on)}
.colors{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;align-items:center;gap:6px}
.sw input[type=color]{width:30px;height:24px;border:1px solid var(--line);border-radius:5px;padding:0;background:none;cursor:pointer}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.theme{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:var(--panel);cursor:pointer;min-width:0}
.theme i{width:22px;height:16px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.15)}
.theme span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{accent-color:var(--fg);width:15px;height:15px;margin:0}
.tabs{display:flex;gap:4px}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 12px;cursor:pointer;font:500 12px var(--f-num)}
.tabs button[aria-pressed="true"]{background:var(--on);color:var(--on-fg);border-color:var(--on)}
.grid9{display:grid;grid-template-columns:repeat(3,26px);gap:4px;grid-column:2 / 4}
.grid9 button{width:26px;height:26px;border:1px solid var(--line);background:var(--panel);border-radius:5px;cursor:pointer;display:grid;place-items:center}
.grid9 button::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--line)}
.grid9 button[aria-pressed="true"]{border-color:var(--fg)}
.grid9 button[aria-pressed="true"]::after{background:var(--accent)}
.imgbox{display:flex;gap:10px;align-items:center}
.imgbox img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--chip)}
.imgbox .meta{min-width:0;display:grid;gap:6px}
.imgbox .name{color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--fg);background:var(--fg);color:var(--panel);border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:500}
.btn.ghost{background:var(--panel);color:var(--fg);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.status{font-size:12px;color:var(--mute);min-height:16px}
.status.err{color:var(--accent)}
.bar{height:3px;background:var(--chip);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.note{font-size:12px;color:var(--mute);margin:0}

@media (max-width:860px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;height:auto}
  .stage{padding-right:max(16px,env(safe-area-inset-right,0px))}
  .canvas-wrap{height:62vh}
  .panel{border-left:0;border-top:1px solid var(--line);padding-left:max(0px,env(safe-area-inset-left,0px))}
}
@media (prefers-reduced-motion: reduce){ .modes button,.pill{transition:none} }
</style>

<div class="app">
  <main class="stage">
    <div class="top">
      <div class="brand" id="brand"><span>генератор</span></div>
      <div class="modes" role="group" aria-label="Режим" id="modes">
        <button id="m-struct" data-mode="struct">Интерференция</button>
        <button id="m-rings" data-mode="rings">Фото в контурах</button>
        <button id="m-trail" data-mode="trail">Шлейф</button>
      </div>
    </div>
    <div class="canvas-wrap" id="wrap">
      <canvas id="cv" width="1080" height="1350" aria-label="Макет"></canvas>
      <div class="drop" id="drop" hidden>Отпустите, чтобы поставить фото</div>
    </div>
    <div class="bottom">
      <div class="fmts" id="fmts" role="group" aria-label="Формат"></div>
      <div class="play">
        <span class="hint" id="hint"></span>
        <button class="pill" id="playBtn" aria-pressed="false">▶ Движение</button>
      </div>
    </div>
  </main>
  <aside class="panel" id="panel" aria-label="Настройки"></aside>
</div>
<input type="file" id="fileIn" accept="image/*" hidden>
